# Run on a VPS with: docker compose up -d --build
#
# The backend listens only on localhost:8080; the host's nginx reverse-proxies
# https://gkn-api.vps.sarvinshrivastava.space -> 127.0.0.1:8080 (TLS via the
# existing *.vps.sarvinshrivastava.space wildcard cert).
#
# Provide the Firebase service-account key (one of):
#   A) Mount the key file (recommended) — place the JSON next to this file as
#      serviceAccountKey.json (mounted read-only below).
#   B) Paste the key JSON into FIREBASE_CREDENTIALS_JSON in a .env file here.

services:
  backend:
    build: .
    image: ghar-ke-nuske-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # localhost only; reachable publicly via nginx HTTPS
    environment:
      PORT: "8080"
      FIREBASE_PROJECT_ID: "ghar-ke-nuske-dev"
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/serviceAccountKey.json"
      FIREBASE_CREDENTIALS_JSON: "${FIREBASE_CREDENTIALS_JSON:-}"
      # Image-upload proxy → company file-service. Token is read from the .env
      # file beside this compose (or the host env); never baked into an image.
      FILE_SERVICE_URL: "${FILE_SERVICE_URL:-https://file-service.habuild.in}"
      FILE_SERVICE_TOKEN: "${FILE_SERVICE_TOKEN:-}"
    volumes:
      - ./serviceAccountKey.json:/secrets/serviceAccountKey.json:ro
